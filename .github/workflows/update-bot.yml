name: Update bot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-bot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/assets
          key: assets-${{ hashFiles('plugins/*/plugin.toml') }}
          restore-keys: assets-

      - name: Pin new releases
        id: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.update_bot --base main --cache "$RUNNER_TEMP/assets"

      # A push made with the workflow token starts no workflow, so publish the index explicitly.
      - name: Publish the index
        if: always() && steps.bot.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-index.yml --repo "${{ github.repository }}" --ref main
