name: Update bot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-bot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      # The bot commits and opens pull requests as the registry's GitHub App, which may bypass main's
      # ruleset, and whose pushes and pull requests start the publish and validate workflows.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.REGISTRY_BOT_APP_ID }}
          private-key: ${{ secrets.REGISTRY_BOT_PRIVATE_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/assets
          key: assets-${{ hashFiles('plugins/*/plugin.toml') }}
          restore-keys: assets-

      - name: Pin new releases
        id: bot
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: python -m tools.update_bot --base main --cache "$RUNNER_TEMP/assets"

